<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thư viện kiến thức – BabyTogether</title>
<meta name="description" content="Kiến thức chăm sóc trẻ sơ sinh, mẹ sau sinh, dinh dưỡng và tiêm chủng – có lộ trình đọc theo tuổi của bé.">
<meta name="theme-color" content="#0076A5">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v=6">
<script src="/assets/js/common.js?v=6" defer></script>
<script src="/assets/js/kien-thuc.js?v=6" defer></script>
</head>
<body data-page="kien-thuc">
<header class="site-header"></header>
<main>
<section class="page-hero"><div class="container">
  <nav class="crumbs"><a href="/">Trang chủ</a><span>/</span><span class="cur">Thư viện kiến thức</span></nav>
  <div class="page-row">
    <div class="page-head" style="max-width:620px">
      <h1 class="h1">Thư viện kiến thức</h1>
      <p class="lead">Kiến thức chăm con được tổng hợp từ WHO, UNICEF và Bộ Y tế – ngắn gọn, dễ hiểu, có nguồn rõ ràng.</p>
    </div>
    <form class="search-bar" id="search-form" role="search" style="width:min(520px,100%)">
      <span data-ic="search" style="color:var(--sky-700)"></span>
      <input id="q" placeholder="Tìm theo từ khóa: rốn, sữa mẹ, sốt…" aria-label="Tìm kiếm">
      <button class="btn">Tìm</button>
    </form>
  </div>
  <div class="chips" id="cats" style="margin-top:28px"></div>
</div></section>
<section style="padding-top:56px"><div class="container" id="paths-wrap"></div></section>
<section style="padding:40px 0 96px"><div class="container lib-layout">
  <aside class="lib-side" id="side"></aside>
  <div>
    <div class="toolbar">
      <div><span class="h4" id="count">…</span> <span class="muted" id="count-sub"></span></div>
      <label class="sr-only" for="sort">Sắp xếp</label>
      <select id="sort" class="select-pill"><option value="recommended">Sắp xếp: Đề xuất</option><option value="newest">Sắp xếp: Mới nhất</option><option value="popular">Sắp xếp: Xem nhiều</option></select>
    </div>
    <div id="featured"></div>
    <div class="grid-3" id="list"></div>
    <div style="display:flex;justify-content:center;padding-top:40px"><button class="btn btn-ghost" id="more" hidden>Xem thêm bài viết</button></div>
  </div>
</div></section>
</main>
<footer class="site-footer"></footer>
</body>
</html>
