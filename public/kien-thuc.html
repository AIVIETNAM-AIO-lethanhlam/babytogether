<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thư viện kiến thức – BabyTogether</title>
<meta name="description" content="Kiến thức chăm sóc trẻ sơ sinh, mẹ sau sinh, dinh dưỡng và tiêm chủng từ nguồn y khoa đáng tin cậy.">
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap&subset=vietnamese" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="/assets/js/common.js" defer></script>
<script src="/assets/js/kien-thuc.js" defer></script>
</head>
<body data-page="kien-thuc">
<header class="site-header"></header>
<main>
<div class="container">
  <section class="page-head">
    <h1 class="h1">Thư viện kiến thức</h1>
    <div class="divider"><span></span></div>
    <p class="lead">Thông tin y khoa đáng tin cậy, đồng hành cùng ba mẹ</p>
    <form class="search-form" id="search-form" role="search">
      <input type="search" id="q" aria-label="Tìm kiếm kiến thức" placeholder="Tìm kiếm kiến thức...">
      <button type="submit" class="btn">Tìm <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    </form>
  </section>

  <section class="cat-grid" id="cats" aria-label="Danh mục"></section>

  <div class="filter-bar">
    <div class="chips" id="age-chips" aria-label="Lọc theo độ tuổi"></div>
    <div class="chips">
      <button class="chip" id="only-bookmarks" type="button">★ Bài đã lưu</button>
    </div>
  </div>

  <section id="featured"></section>

  <section>
    <div class="section-head">
      <h2 class="h2" id="list-title">Tất cả bài viết</h2>
      <span class="meta" id="reading-progress"></span>
    </div>
    <div class="post-grid" id="list"></div>
    <div style="display:flex;justify-content:center;padding:56px 0 96px">
      <button class="btn" id="more" hidden>Xem thêm</button>
    </div>
  </section>
</div>
</main>
<footer class="site-footer"></footer>
</body>
</html>
